# Netlify build for the Next.js app. Next is a server app, not static files:
# it must be built on Netlify and served through the Next.js runtime, or the
# site root has no index.html and every path returns Netlify's 404.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
